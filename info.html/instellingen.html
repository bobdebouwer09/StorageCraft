<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instellingen - Minecraft Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- LINKER SIDEBAR (NAVIGATIE) -->
    <div class="sidebar-nav">
        <button class="mc-button full-width" onclick="window.location.href='startpagina.html'" style="background-color: #ffaa00; color: #000;">
            🏠 DASHBOARD
        </button>
    </div>

    <!-- MIDDEN (INSTELLINGEN CONTENT) -->
    <div class="main-content" style="flex: 1; max-width: 700px; margin: 0 auto;">
        <div class="page active">
            <h1 style="text-align: center;">⚙️ INSTELLINGEN</h1>

            <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;">

                <!-- BLOK 1: LOKAAL PROFIEL -->
                <div class="right-box" style="text-align: left; padding: 15px;">
                    <h3 class="search-title" style="color: var(--mc-text-gold);">👤 ACCOUNT & PROFIEL</h3>
                    <p style="color: #ccc; font-size: 1.3rem; margin-bottom: 10px;">Jouw publieke spelersnaam:</p>

                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="accountNameInput" class="mc-input" placeholder="Jouw Minecraft naam...">
                        <button class="mc-button" id="btnSaveAccount" style="background-color: #55ff55; color: #000; font-size: 1.4rem;">OPSLAAN</button>
                    </div>
                    <div id="accountStatus" style="font-size: 1.2rem; color: #ffaa00;"></div>
                    <p style="color: #ccc; font-size: 1.1rem; margin-bottom: 0;">Deze naam wordt getoond bij je openbare storages. Je e-mailadres wordt niet publiek getoond.</p>
                </div>

                <!-- BLOK 2: THEMA SWITCH -->
                <div class="right-box" style="text-align: left; padding: 15px;">
                    <h3 class="search-title" style="color: var(--mc-text-gold);">WEERGAVE</h3>
                    <p style="color: #ccc; font-size: 1.3rem; margin-bottom: 15px;">Kies het thema van de app:</p>

                    <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(37,37,37,0.9); padding: 12px 15px; border: 3px solid #555;">
                        <span id="themeLabel" style="font-size: 1.4rem; color: #fff;">🌙 Donkere Modus</span>

                        <!-- DE TOGGLE SWITCH -->
                        <label class="mc-switch">
                            <input type="checkbox" id="themeCheckbox">
                            <span class="mc-slider"></span>
                        </label>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
